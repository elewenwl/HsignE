name: Beta Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Disable Plugin Validation
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Clean Package Cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build
        run: |
          xcodebuild clean build \
            -project Ksign.xcodeproj \
            -scheme Ksign \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Package IPA
        if: always()
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/*.app build/Payload/
          
          cd build/Payload
          for f in *.app; do
            if [ "$f" != "H-sign.app" ]; then
              mv "$f" "H-sign.app"
            fi
          done
          
          cd H-sign.app
          if [ -f "Ksign" ]; then
            mv "Ksign" "H-sign"
          fi
          cd ../..
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName H-sign" build/Payload/H-sign.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName H-sign" build/Payload/H-sign.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable H-sign" build/Payload/H-sign.app/Info.plist || true
          
          cd build && zip -r H-sign-unsigned.ipa Payload

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H-sign-unsigned-ipa
          path: build/H-sign-unsigned.ipa

      - name: Update Beta Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: H-sign Beta
          draft: true
          prerelease: true
          files: build/H-sign-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
